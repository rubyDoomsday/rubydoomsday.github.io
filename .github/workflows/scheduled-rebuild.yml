# GitHub Pages only rebuilds on push, and Jekyll skips future-dated posts at
# build time. Rebuilding once a day lets a post go live on (or within a day
# of) its date without anyone having to push.
name: Scheduled Pages rebuild

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC (6am PT)
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
